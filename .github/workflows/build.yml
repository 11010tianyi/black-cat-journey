name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  desktop:
    name: Export Linux / Windows / macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.6.3.stable"

      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --import'

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # GDExtension libraries are only packed when the extension is loaded in a
      # real display server, so export under xvfb instead of --headless.
      - name: Export desktops
        run: |
          set -euo pipefail
          mkdir -p build/linux build/windows build/macos
          xvfb-run -a "$GODOT_BIN" --path game --export-release "Linux" "$PWD/build/linux/black-cat-journey.x86_64"
          xvfb-run -a "$GODOT_BIN" --path game --export-release "Windows" "$PWD/build/windows/black-cat-journey.exe"
          # Unsigned: Gatekeeper will still warn on first open.
          xvfb-run -a "$GODOT_BIN" --path game --export-release "macOS" "$PWD/build/macos/BlackCatJourney.zip"

      - uses: actions/upload-artifact@v4
        with: { name: black-cat-journey-linux-x86_64, path: build/linux/ }
      - uses: actions/upload-artifact@v4
        with: { name: black-cat-journey-windows-x86_64, path: build/windows/ }
      - uses: actions/upload-artifact@v4
        with: { name: black-cat-journey-macos, path: build/macos/ }

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.6.3.stable"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12

      - name: Point Godot at the SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --import'

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Export APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          xvfb-run -a "$GODOT_BIN" --path game --export-debug "Android" "$PWD/build/android/black-cat-journey.apk"
          ls -la build/android
          unzip -l build/android/black-cat-journey.apk | grep -i terrain || echo "WARNING: no terrain libs in APK"

      - uses: actions/upload-artifact@v4
        with: { name: black-cat-journey-android-apk, path: build/android/ }

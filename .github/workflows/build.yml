name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  export:
    name: Export Linux / Windows / Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Templates are ~1 GB and only needed for exporting, so the test workflow
      # stays lean and this one pays the download.
      - name: Install Godot 4.6.3 and export templates
        run: |
          set -euo pipefail
          version="4.6.3-stable"
          base="https://github.com/godotengine/godot/releases/download/${version}"
          curl -fsSL "${base}/Godot_v${version}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${version}_linux.x86_64"
          echo "GODOT_BIN=/tmp/godot/Godot_v${version}_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL "${base}/Godot_v${version}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.6.3.stable"

      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --import'

      - name: Export all presets
        run: |
          set -euo pipefail
          mkdir -p build/linux build/windows build/web
          "$GODOT_BIN" --headless --path game --export-release "Linux" "$PWD/build/linux/black-cat-journey.x86_64"
          "$GODOT_BIN" --headless --path game --export-release "Windows" "$PWD/build/windows/black-cat-journey.exe"
          "$GODOT_BIN" --headless --path game --export-release "Web" "$PWD/build/web/index.html"

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: black-cat-journey-linux-x86_64
          path: build/linux/

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: black-cat-journey-windows-x86_64
          path: build/windows/

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: black-cat-journey-web
          path: build/web/

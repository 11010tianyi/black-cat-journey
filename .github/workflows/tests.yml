name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable-slice:
    name: Playable slice (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project targets 4.6, and the slice test is written against the
      # engine's own headless runner, so pin the exact engine build here.
      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          version="4.6.3-stable"
          url="https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${version}_linux.x86_64"
          echo "GODOT_BIN=/tmp/godot/Godot_v${version}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import assets
        run: '"$GODOT_BIN" --headless --path game --import'

      - name: Run the playable slice test
        run: ./game/tests/run.sh
